services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend
      args:
        # Lu par le navigateur : doit pointer vers une URL atteignable depuis l'hôte,
        # pas le nom du service docker (voir frontend/src/lib/voice.ts).
        NEXT_PUBLIC_WS_URL: ws://localhost:8000
    ports:
      - "3000:3000"
    environment:
      # Lu côté serveur par la route /api/chat : peut utiliser le nom du service docker.
      API_URL: http://backend:8000
    depends_on:
      - backend
